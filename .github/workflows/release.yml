name: Release

# Publishing a GitHub release (tag v1.2.3) builds Canvas.jar at that version and attaches it.
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        run: |
          VERSION="${TAG#v}"
          ./gradlew build -Pcanvas.strict=true -PcanvasVersion="$VERSION"
          cp "canvas-paper/build/libs/Canvas-$VERSION.jar" Canvas.jar
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Attach Canvas.jar
        run: gh release upload "$TAG" Canvas.jar --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
